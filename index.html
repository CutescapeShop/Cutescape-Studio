<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cutescape Studio</title>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.167.1/build/three.module.js"
  }
}
</script>

<link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="header">
      <h1>✨ Cutescape Studio ✨</h1>
      <p>ออกแบบพวงกุญแจชื่อของคุณเอง</p>
    </header>

    <section class="studio">

      <aside class="panel">

        <h2>ออกแบบสินค้า</h2>

        <div class="field">
          <label for="nameInput">ชื่อ</label>

          <input
            id="nameInput"
            type="text"
            value="KIRIN"
            maxlength="12"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="fontSelect">รูปแบบตัวอักษร</label>

          <select id="fontSelect">
            <optgroup label="ฟอนต์พื้นฐาน">
              <option value="Arial Black">หนา</option>
              <option value="Arial Rounded MT Bold">กลมมน</option>
              <option value="Comic Sans MS">น่ารัก</option>
              <option value="Georgia">คลาสสิก</option>
            </optgroup>

            <optgroup label="ฟอนต์ไทยของร้าน">
              <option value="18jindaEclair">18jindaEclair</option>
              <option value="18jindaEclairBold" selected>18jindaEclairBold</option>
              <option value="18jindaEclairThin">18jindaEclairThin</option>
              <option value="33JindaKoko">33JindaKoko</option>
              <option value="33JindaKokoBold">33JindaKokoBold</option>
              <option value="33JindaKokoThin">33JindaKokoThin</option>
              <option value="HappyThursday">HappyThursday</option>
              <option value="HappyThursdayCute">HappyThursdayCute</option>
              <option value="HappyThursdayThin">HappyThursdayThin</option>
              <option value="JindaApollo">JindaApollo</option>
              <option value="JindaApolloBold">JindaApolloBold</option>
              <option value="JindaApolloSp">JindaApolloSp</option>
              <option value="JindaApolloThin">JindaApolloThin</option>
              <option value="JindaBiscuit">JindaBiscuit</option>
              <option value="JindaBiscuitBold">JindaBiscuitBold</option>
              <option value="JindaBiscuitPie">JindaBiscuitPie</option>
              <option value="JindaBiscuitPieBold">JindaBiscuitPieBold</option>
              <option value="JindaBiscuitPieThin">JindaBiscuitPieThin</option>
              <option value="JindaBiscuitThin">JindaBiscuitThin</option>
              <option value="JindaWhisky">JindaWhisky</option>
              <option value="JindaWhiskyBold">JindaWhiskyBold</option>
              <option value="JindaWhiskyPremium">JindaWhiskyPremium</option>
              <option value="JindaWhiskyThin">JindaWhiskyThin</option>
              <option value="JindGoody">JindGoody</option>
              <option value="JindGoodyBold">JindGoodyBold</option>
              <option value="JindGoodyThin">JindGoodyThin</option>
              <option value="Lovebird">Lovebird</option>
              <option value="magic love">magic love</option>
              <option value="MiMarshmallow">MiMarshmallow</option>
              <option value="MiMarshmallowBold">MiMarshmallowBold</option>
              <option value="MiMarshmallowThin">MiMarshmallowThin</option>
              <option value="MiPie">MiPie</option>
              <option value="MiPieBold">MiPieBold</option>
              <option value="MiPieThin">MiPieThin</option>
              <option value="MN KAOPAT Italic">MN KAOPAT Italic</option>
              <option value="MN KAOPAT">MN KAOPAT</option>
              <option value="MN MOCHI Italic">MN MOCHI Italic</option>
              <option value="MN MOCHI">MN MOCHI</option>
              <option value="MN Mocktail Italic">MN Mocktail Italic</option>
              <option value="MN Mocktail">MN Mocktail</option>
              <option value="MN Saikrok Isan Italic">MN Saikrok Isan Italic</option>
              <option value="MN Saikrok Isan">MN Saikrok Isan</option>
              <option value="MN Tomyam Italic">MN Tomyam Italic</option>
              <option value="MN Tomyam">MN Tomyam</option>
              <option value="Moji">Moji</option>
              <option value="Saturn">Saturn</option>
              <option value="SaturnThin">SaturnThin</option>
            </optgroup>
          </select>
        </div>

        <div class="field">
  <label for="baseStyleSelect">รูปทรงฐาน</label>

  <select id="baseStyleSelect">
    <option value="outline">
      ไดคัทตามชื่อ
    </option>

    <option value="capsule">
      ป้ายแคปซูล
    </option>
    <option value="sticker">
     ไดคัท (เหมือนตัวเลือกแรก)
    </option>
  </select>
  <div class="outline-control">
  <label for="outlineSlider">ความหนาขอบไดคัท</label>

  <input
    type="range"
    id="outlineSlider"
    min="0.10"
    max="0.32"
    step="0.01"
    value="0.18"
  >

  <div class="outline-value">
    <span>บาง</span>
    <span id="outlineValue">0.18</span>
    <span>หนา</span>
  </div>
</div>
</div>

        <div class="field">
          <label>สีฐาน</label>

          <div class="color-row" id="baseColors">
            <button
              class="color-button active"
              data-color="#111111"
              style="background:#111111"
              title="ดำ"
            ></button>

            <button
              class="color-button"
              data-color="#ff7eb6"
              style="background:#ff7eb6"
              title="ชมพู"
            ></button>

            <button
              class="color-button"
              data-color="#78c8ff"
              style="background:#78c8ff"
              title="ฟ้า"
            ></button>

            <button
              class="color-button"
              data-color="#a889ff"
              style="background:#a889ff"
              title="ม่วง"
            ></button>

            <button
              class="color-button"
              data-color="#fff3a3"
              style="background:#fff3a3"
              title="เหลือง"
            ></button>
          </div>
        </div>

        <div class="field">
          <label>สีตัวอักษร</label>

          <div class="color-row" id="textColors">
            <button
              class="color-button active"
              data-color="#ffffff"
              style="background:#ffffff"
              title="ขาว"
            ></button>

            <button
              class="color-button"
              data-color="#111111"
              style="background:#111111"
              title="ดำ"
            ></button>

            <button
              class="color-button"
              data-color="#ffeb3b"
              style="background:#ffeb3b"
              title="เหลือง"
            ></button>

            <button
              class="color-button"
              data-color="#ff70b7"
              style="background:#ff70b7"
              title="ชมพู"
            ></button>
          </div>
        </div>

        <button class="order-button" id="orderButton">
          ยืนยันแบบนี้
        </button>

      </aside>

      <section class="preview-panel">

        <div class="preview-title">
          <h2>ตัวอย่างสินค้า</h2>
          <span class="live-badge">● LIVE PREVIEW</span>
        </div>

        <div class="preview-stage">
            
            <div id="threeViewer"></div>

          <div class="keychain-wrap">

            <div class="keychain" id="keychain">

              <div class="hole-area"></div>
              <div class="hole"></div>

              <div
                class="name-preview"
                id="namePreview"
              >
                KIRIN
              </div>

            </div>

          </div>

        </div>

        <div class="hint">
          พิมพ์ชื่อหรือเลือกสี แล้วตัวอย่างจะเปลี่ยนทันที
        </div>

      </section>

    </section>

  </main>

<!-- HarfBuzz: จัดตำแหน่งสระ/วรรณยุกต์ภาษาไทยตาม OpenType GPOS/GSUB -->
<script src="https://unpkg.com/harfbuzzjs@0.8.0/hb.js"></script>
<script src="https://unpkg.com/harfbuzzjs@0.8.0/hbjs.js"></script>
<script src="script.js"></script>
<script type="module" src="viewer.js"></script>

</body>
</html>
